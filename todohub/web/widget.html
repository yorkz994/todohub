<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo Hub</title>
<style>
:root{--ink:#16202B;--soft:#5E6B7A;--line:rgba(0,0,0,.12);--chip:rgba(0,0,0,.06);--field:rgba(0,0,0,.05);--alert:#C8321F;
  --invest:#0E8F6E;--research:#2F6FED;--bd:#B4601A;--coding:#7A4CD9;--personal:#C23B6B}
@media (prefers-color-scheme:dark){:root{--ink:#E9EEF3;--soft:#9AA8B7;--line:rgba(255,255,255,.14);--chip:rgba(255,255,255,.1);--field:rgba(255,255,255,.08);--alert:#FF8A78;
  --invest:#3CC7A2;--research:#7FA8FF;--bd:#E8A460;--coding:#B49BF7;--personal:#F08DB0}}
/* 桌面悬浮窗的底是深色毛玻璃，不跟随系统明暗 */
html.desk{--ink:#F1F4F7;--soft:#A9B5C2;--line:rgba(255,255,255,.16);--chip:rgba(255,255,255,.12);--field:rgba(255,255,255,.1);--alert:#FF8A78;
  --invest:#3CC7A2;--research:#7FA8FF;--bd:#E8A460;--coding:#B49BF7;--personal:#F08DB0}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;height:100%}
body{font:13px/1.45 -apple-system,"PingFang SC",system-ui,sans-serif;color:var(--ink);padding:10px 12px 12px;font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column}
html.desk body{padding-top:2px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--research);outline-offset:1px}
.head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.count{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--soft);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.late{color:var(--alert);font-weight:600}
.btn{border:1px solid var(--line);background:none;border-radius:6px;padding:2px 8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--chip)}
.add{display:flex;gap:6px;margin-bottom:8px}
.add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--field);border-radius:6px;padding:5px 8px;-webkit-user-select:text;user-select:text}
.add select{width:108px;border:1px solid var(--line);background:var(--field);border-radius:6px;padding:4px}
.list{flex:1;overflow-y:auto;margin:0 -4px;padding:0 4px}
.line{display:flex;align-items:center;gap:6px;font-weight:700;margin:12px 0 2px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.line:first-child{margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--soft));flex:none}
.invest{--c:var(--invest)} .research{--c:var(--research)} .bd{--c:var(--bd)} .coding{--c:var(--coding)} .personal{--c:var(--personal)}
.proj{color:var(--soft);font-weight:600;margin:7px 0 1px;font-size:12px}
.row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:6px;align-items:start;padding:3px 0}
.row input{width:14px;height:14px;margin:2px 0 0;accent-color:var(--ink)}
.t{overflow-wrap:anywhere}
.meta{color:var(--soft);font-size:11.5px}
.tag{display:inline-block;background:var(--chip);border-radius:4px;padding:0 5px;margin-right:4px}
.due{color:var(--soft);font-size:11.5px;white-space:nowrap;padding-top:1px}
.due.late{color:var(--alert)}
.note{color:var(--soft);padding:14px 2px}
.foot{color:var(--soft);font-size:11px;margin-top:6px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="head" id="head"></div>
<div class="add" id="add"></div>
<div class="list" id="list"></div>
<div class="foot" id="foot"></div>
<script>
"use strict";
const Q = new URLSearchParams(location.search), MODE = Q.get("mode") || "pop";
let panel = Q.get("panel") || "float", S = null, msg = "";
if (MODE === "desk") document.documentElement.classList.add("desk");
const native = m => { try { window.webkit.messageHandlers.hub.postMessage(m); return true; } catch (e) { return false; } };
const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs || {})){
    if (v === false || v == null) continue;
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, ""); else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json","X-Hub":"1"}, body:JSON.stringify(body)} : {cache:"no-store"});
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
async function emit(type, data){
  try { await api("/api/event", {type, data}); msg = ""; await load(); native({cmd:"changed"}); }
  catch (e) { msg = "没写进去：" + e.message; render(); }
}
function row(t){
  const due = t.due ? (t.overdue ? "逾期 " : "") + t.due.slice(5) : "";
  return h("div", {class:"row"},
    h("input", {type:"checkbox", "aria-label":"完成：" + t.title, onchange:() => emit("todo.done", {id:t.id})}),
    h("div", {}, h("div", {class:"t"}, t.title), t.thread && h("div", {class:"meta"}, h("span", {class:"tag"}, t.thread))),
    h("div", {class:"due" + (t.overdue ? " late" : "")}, due));
}
function render(){
  if (!S) return;
  const open = S.todos.filter(t => t.status === "open"), late = open.filter(t => t.overdue).length, today = open.filter(t => t.due === S.today).length;
  const head = [h("span", {class:"count"}, open.length), h("span", {class:"sub"}, "条未完成", late ? [" ，", h("span", {class:"late"}, "逾期 " + late)] : today ? " ，今天到期 " + today : "")];
  if (MODE === "desk") head.push(h("button", {class:"btn", title:"置顶：盖在所有窗口上；贴桌面：在所有窗口下面", onclick:() => native({cmd:"mode", mode: panel === "float" ? "desk" : "float"})}, panel === "float" ? "改为贴桌面" : "改为置顶"),
    h("button", {class:"btn", title:"从菜单栏图标右键可以再打开", onclick:() => native({cmd:"mode", mode:"hidden"})}, "隐藏"));
  head.push(h("button", {class:"btn", onclick:() => native({cmd:"open"}) || window.open("/", "_blank")}, "看板"));
  $("head").replaceChildren(...head);

  if (!$("add").firstChild){
    const title = h("input", {placeholder:"加一条，回车保存", "aria-label":"新 todo"}), sel = h("select", {"aria-label":"项目"});
    title.addEventListener("keydown", e => { if (e.key !== "Enter" || !title.value.trim()) return;
      const d = {title:title.value.trim(), source: MODE === "desk" ? "悬浮窗" : "菜单栏"}; if (sel.value) d.project = sel.value; title.value = ""; emit("todo.add", d); });
    $("add").append(title, sel);
  }
  const sel = $("add").querySelector("select"), keep = sel.value;
  sel.replaceChildren(h("option", {value:""}, "不归项目"), ...S.lines.map(l => { const ps = S.projects.filter(p => p.category === l.id && p.status === "active");
    return ps.length ? h("optgroup", {label:l.name}, ps.map(p => h("option", {value:p.id}, p.name))) : null; }).filter(Boolean));
  sel.value = keep;

  const byDue = (a, b) => (a.due || "9999").localeCompare(b.due || "9999") || (a.priority || 2) - (b.priority || 2);
  const out = [], seen = new Set();
  for (const l of S.lines){
    const ps = S.projects.filter(p => p.category === l.id && open.some(t => t.project === p.id)); if (!ps.length) continue;
    out.push(h("div", {class:"line"}, h("span", {class:"dot " + (l.color || "")}), l.name, h("span", {class:"meta", style:"font-weight:400"}, open.filter(t => ps.some(p => p.id === t.project)).length)));
    for (const p of ps){
      const rows = open.filter(t => t.project === p.id).sort(byDue); rows.forEach(t => seen.add(t.id));
      out.push(h("div", {class:"proj"}, p.name), rows.map(row));
    }
  }
  const loose = open.filter(t => !seen.has(t.id)).sort(byDue);
  if (loose.length) out.push(h("div", {class:"line"}, "还没归到项目"), loose.map(row));
  if (!open.length) out.push(h("div", {class:"note"}, "没有未完成的 todo。在上面加一条，或者在提醒事项里写，下次同步会进来。"));
  const y = $("list").scrollTop; $("list").replaceChildren(...out.flat(Infinity)); $("list").scrollTop = y;
  const now = new Intl.DateTimeFormat("zh-CN", {timeZone:S.timezone, hour:"2-digit", minute:"2-digit", hour12:false}).format(new Date());
  $("foot").replaceChildren(h("span", {class: msg ? "late" : ""}, msg || (S.today + " " + S.week.slice(5))), h("span", {}, now + " 更新"));
}
async function load(){
  try { S = await api("/api/state"); render(); }
  catch (e) { if (!S) $("list").replaceChildren(h("div", {class:"note"}, "连不上 Todo Hub 常驻服务，稍后自动重试。")); }
}
window.hubRefresh = load;
window.hubPanelMode = m => { panel = m; render(); };
load(); setInterval(() => { if (document.activeElement.tagName !== "INPUT") load(); }, 30000);
</script>
</body>
</html>
